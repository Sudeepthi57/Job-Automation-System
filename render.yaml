services:
  - type: web
    name: job-automation-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-automation-demo-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"

databases:
  - name: job-automation-demo-db
    plan: free
